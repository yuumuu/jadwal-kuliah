<!DOCTYPE html>
<html lang="id" data-style="default" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Jadwal kuliah interaktif — lihat jadwal per semester, cari ruang kosong, deteksi bentrok, dan ekspor ke .ics.">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Jadwal Kuliah">
<meta property="og:description" content="Jadwal kuliah interaktif — cari, filter, ekspor.">
<meta property="og:type" content="website">
<title>Jadwal Kuliah</title>

<script>
  // Pre-paint: cegah flash tema sebelum CSS render
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('jadkul_prefs_v2') || '{}');
      if (p.theme) document.documentElement.dataset.theme = p.theme;
      if (p.style) document.documentElement.dataset.style = p.style;
    } catch (e) {}
  })();
</script>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<noscript>
  <div class="noscript">Aplikasi ini membutuhkan JavaScript untuk menampilkan jadwal.</div>
</noscript>

<div id="app" class="app" hidden>
  <header class="app-header">
    <div class="app-header__inner">
      <button class="brand" id="brandBtn" aria-label="Buka menu">
        <span class="brand__mark" aria-hidden="true">JK</span>
        <span class="brand__text">
          <strong id="headerTitle">Jadwal Kuliah</strong>
          <small id="headerSubtitle">Memuat…</small>
        </span>
      </button>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" aria-label="Ganti tema" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>
        <button class="icon-btn" id="menuBtn" aria-label="Buka menu pengaturan">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="app-main" id="appMain">
    <section class="now-next" id="nowNext" aria-live="polite" aria-label="Kelas sekarang dan berikutnya"></section>
    <div class="view" id="viewRoot"></div>
  </main>

  <nav class="tabs-nav" id="tabsNav" role="tablist" aria-label="Navigasi utama"></nav>
  <nav class="bottom-nav" id="bottomNav" role="tablist" aria-label="Navigasi utama"></nav>

  <button class="fab" id="fabAi" aria-label="Tanya asisten jadwal" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3a9 9 0 0 1 9 9v3a4 4 0 0 1-4 4h-1v2a2 2 0 0 1-3.4 1.4L10 20H9a9 9 0 0 1-9-9 9 9 0 0 1 9-9Z"/>
      <circle cx="9" cy="12" r="1.2" fill="currentColor"/><circle cx="15" cy="12" r="1.2" fill="currentColor"/>
    </svg>
  </button>
</div>

<div class="skeleton-app" id="skeleton" aria-hidden="true">
  <div class="sk sk-header"></div>
  <div class="sk sk-hero"></div>
  <div class="sk sk-row"></div>
  <div class="sk sk-row"></div>
  <div class="sk sk-card"></div>
  <div class="sk sk-card"></div>
</div>

<div class="toast-stack" id="toastStack" role="status" aria-live="polite" aria-atomic="false"></div>

<div class="overlay-backdrop" id="overlayBackdrop" hidden></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet__handle" aria-hidden="true"></div>
  <header class="sheet__header">
    <h2 class="sheet__title" id="sheetTitle"></h2>
    <button class="icon-btn" id="sheetClose" aria-label="Tutup">✕</button>
  </header>
  <div class="sheet__body" id="sheetBody"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
